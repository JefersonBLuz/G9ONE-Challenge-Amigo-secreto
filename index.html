<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/amigo-secreto.png">
  <title>Amigo Secreto</title>
</head>

<body>
  <main class="main-content">
    <header class="header-banner">
      <h1 class="main-title">Amigo Secreto</h1>
      <img src="assets/amigo-secreto.png" alt="Imagem representativa de amigo secreto">
    </header>

    <section class="input-section">
      <h2 class="section-title">Digite o nome dos seus amigos</h2>
      <div class="input-wrapper">
        <input type="text" id="amigo" class="input-name" placeholder="Digite um nome">
        <button class="button-add" onclick="adicionarAmigo()">Adicionar</button>
      </div>
      <h3 id="error-message" class="error-message"></h3>
      <div id="table-container" class="table-container">
      <table class="table-wrapper">
        <tbody id="listaAmigos" aria-labelledby="listaAmigos" role="list">
          <!-- As linhas dos amigos serão inseridas dinamicamente via JavaScript -->
        </tbody>
      </table>
      </div>
      <ul id="resultado" class="result-list" aria-live="polite"></ul>

      <div class="button-container">
        <button class="button-clear" onclick="limparLista()">
          <img src="assets/play_circle_outline.png" alt="Ícone para limpar lista">
          Limpar Lista
        </button>
        <button class="button-draw" onclick="sortearAmigo()" aria-label="Sortear amigo secreto">
          <img src="assets/play_circle_outline.png" alt="Ícone para sortear">
          Sortear amigo
        </button>
      </div>
      <footer class="footer-content">
        <p class="footer-text">©2025 Desenvolvido por Jeferson Braga</p>
      </footer>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>

</html>
